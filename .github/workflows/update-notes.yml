name: Update note articles

on:
  # 毎週 日曜 06:00 JST（＝土曜 21:00 UTC）に自動取得
  schedule:
    - cron: "0 21 * * 6"
  # 手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch note articles
        run: node scripts/fetch-notes.mjs wtcajptc

      # notes.json を更新してコミット。
      # リポジトリを Netlify に連携していれば、この push で自動再デプロイされます。
      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/notes.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: note記事データを自動更新"
            git push
          fi
