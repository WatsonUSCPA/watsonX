name: Update note articles

on:
  # 毎日 06:00 JST（21:00 UTC）に自動取得
  schedule:
    - cron: "0 21 * * *"
  # 手動実行も可能
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Pagesデプロイの同時実行を防ぐ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch note articles
        run: node scripts/fetch-notes.mjs wtcajptc

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/notes.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: note記事データを自動更新"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
